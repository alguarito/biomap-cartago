# Publica el sitio estático en GitHub Pages en cada push a main (sin paso de compilación).
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar el sitio (solo lo que se publica)
        run: |
          mkdir _sitio
          cp -r index.html css js vendor datos _sitio/
          cp README.md _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
